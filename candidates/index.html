const dlg = document.getElementById('dlg'), big = document.getElementById('big'), bid = document.getElementById('bid'), bpick = document.getElementById('bpick'); let cur = null;
main.addEventListener('click', e => { const c = e.target.closest('.card'); if (!c) return; const id = c.dataset.id;
  if (e.target.closest('.zoom')) { cur = id; big.src = c.querySelector('img').src; big.alt = id; bid.textContent = id; bpick.textContent = picks.has(id) ? '外す' : '選ぶ'; dlg.showModal(); return; }
  if (e.target.closest('.pk')) { picks.has(id) ? picks.delete(id) : picks.add(id); sync(); } });
bpick.addEventListener('click', () => { picks.has(cur) ? picks.delete(cur) : picks.add(cur); sync(); dlg.close(); });
document.getElementById('bclose').addEventListener('click', () => dlg.close());
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
document.getElementById('copy').addEventListener('click', async ev => { try { await navigator.clipboard.writeText(out.value); ev.target.textContent = 'コピーしました'; } catch (e) { out.focus(); out.select(); ev.target.textContent = '選択しました'; } setTimeout(() => ev.target.textContent = '番号をコピー', 1500); });
const clr = document.getElementById('clear'); let armed = 0;
clr.addEventListener('click', () => { if (!picks.size) return; if (!armed) { clr.textContent = 'もう一度押すと全部外れます'; armed = setTimeout(() => { armed = 0; clr.textContent = '全部外す'; }, 4000); return; }
  clearTimeout(armed); armed = 0; clr.textContent = '全部外す'; picks.clear(); sync(); });
sync();
